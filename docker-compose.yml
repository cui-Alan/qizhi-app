version: "3.8"

services:
  qizhi-app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - AI_PROVIDER=${AI_PROVIDER:-ollama}
      - OMLX_BASE_URL=${OMLX_BASE_URL:-http://host.docker.internal:8000/v1}
      - OMLX_API_KEY=${OMLX_API_KEY:-local}
      - DEFAULT_MODEL=${DEFAULT_MODEL:-DeepSeek-R1-Distill-Qwen-32B-AWQ}
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Optional: local PostgreSQL for dev (when not using Supabase)
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: qizhi
      POSTGRES_PASSWORD: qizhi_dev
      POSTGRES_DB: qizhi
    volumes:
      - pgdata:/var/lib/postgresql/data
    profiles:
      - dev

volumes:
  pgdata:
